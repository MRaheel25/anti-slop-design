services:
  - type: web
    name: anti-slop-design-mcp
    env: node
    plan: free
    rootDir: mcp
    buildCommand: npm install && npm run build
    startCommand: node dist/server.js --http
    envVars:
      - key: MCP_TRANSPORT
        value: http
      - key: NODE_ENV
        value: production
    healthCheckPath: /health
